name: Integration domain POC
on:
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [config, selection]
        default: config
      variant:
        type: choice
        options: [baseline, candidate]
        default: baseline
      group:
        type: choice
        options: [location, gallery]
        default: location
      scenario:
        type: choice
        options: [country, gallery]
        default: country
      round:
        type: choice
        options: ['1', '2']
        default: '1'
  workflow_call:
    inputs:
      experiment:
        type: string
        required: true
      variant:
        type: string
        required: true
      group:
        type: string
        required: true
      scenario:
        type: string
        required: true
      round:
        type: string
        required: true
    secrets:
      GH_PACKAGES_READ_TOKEN:
        required: true
      PAYLOAD_SECRET:
        required: true
      PREVIEW_SECRET:
        required: true
permissions:
  contents: read
concurrency:
  group: integration-domain-poc-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  measure:
    if: github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/agent/ci-shard-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      DEPLOYMENT_ENV: test
      CI_DB_COPY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.28.2
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - name: Install frozen dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/assert-email-template-package-access.mjs
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Record runner hardware
        run: node scripts/ci-build-evidence.mjs --kind runner --output tmp/domain-poc/runner.json
      - name: Measure isolated workload
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
          POC_EXPERIMENT: ${{ inputs.experiment }}
          POC_VARIANT: ${{ inputs.variant }}
          POC_GROUP: ${{ inputs.group }}
          POC_SCENARIO: ${{ inputs.scenario }}
          POC_ROUND: ${{ inputs.round }}
        run: |
          set -euo pipefail
          node scripts/ci-domain-poc-run.mjs --experiment "$POC_EXPERIMENT" --variant "$POC_VARIANT" --group "$POC_GROUP" --scenario "$POC_SCENARIO" --round "$POC_ROUND" --output tmp/domain-poc/measurement
      - name: Clean test services
        if: always()
        run: docker compose -p findmydoc-test -f docker-compose.test.yml down --volumes
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: domain-poc-${{ github.run_id }}
          path: tmp/domain-poc
          if-no-files-found: error
          retention-days: 7
