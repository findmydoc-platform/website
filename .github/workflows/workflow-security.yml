name: Workflow Security

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.secrets.baseline'
      - 'zizmor.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.secrets.baseline'
      - 'zizmor.yml'
  schedule:
    - cron: '50 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Select changed security files
        if: github.event_name == 'pull_request'
        id: security-paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          list-files: json
          filters: |
            workflows:
              - added|modified|copied: '.github/workflows/**/*.{yml,yaml}'
              - added|modified|copied: '.github/actions/**'
            secrets:
              - added|modified|copied: '**/!(pnpm-lock.yaml)'

      - name: Determine zizmor inputs
        id: zizmor-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.security-paths.outputs.workflows_files }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          files = json.loads(os.environ["CHANGED_FILES"]) if os.environ["EVENT_NAME"] == "pull_request" else []
          if not files:
              files = subprocess.check_output([
                  "git", "ls-files", "-z", ".github/workflows/*.yml",
                  ".github/workflows/*.yaml", ".github/actions/**",
              ]).decode().rstrip("\0").split("\0")
              files = [file for file in files if file]

          # The pinned action splits inputs on whitespace and expands shell globs.
          if any(not re.fullmatch(r"[-A-Za-z0-9_./]+", file) for file in files):
              files = [directory for directory in [".github/workflows", ".github/actions"] if Path(directory).is_dir()]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("inputs=" + " ".join(files) + "\n")
          PYTHON

      - name: GitHub workflow lint (actionlint)
        uses: reviewdog/action-actionlint@0d952c597ef8459f634d7145b0b044a9699e5e43 # v1.71.0
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

      - name: GitHub workflow security audit (zizmor)
        uses: zizmorcore/zizmor-action@0dce2577a4760a2749d8cfb7a84b7d5585ebcb7d # v0.5.0
        with:
          advanced-security: 'false'
          annotations: 'true'
          config: zizmor.yml
          inputs: ${{ steps.zizmor-inputs.outputs.inputs }}
          persona: regular
          min-severity: medium
          min-confidence: medium

      - name: Setup Python for detect-secrets
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install detect-secrets==1.5.0

      - name: Detect secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.security-paths.outputs.secrets_files }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          if os.environ["EVENT_NAME"] == "pull_request":
              files = json.loads(os.environ["CHANGED_FILES"])
              if files:
                  subprocess.run(["detect-secrets-hook", "--baseline", ".secrets.baseline", "--", *files], check=True)
              else:
                  print("No changed files found for secret scan.")
          else:
              subprocess.run(["detect-secrets", "scan", "--baseline", ".secrets.baseline"], check=True)
          PYTHON
