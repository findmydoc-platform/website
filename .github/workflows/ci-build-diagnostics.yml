name: Isolated build diagnostics
on:
  workflow_call:
    inputs:
      experiment:
        required: true
        type: string
      variant:
        required: true
        type: string
      scenario:
        required: true
        type: string
      round:
        required: true
        type: string
      failure:
        required: true
        type: string
    secrets:
      GH_PACKAGES_READ_TOKEN:
        required: true
      PAYLOAD_SECRET:
        required: true
      PREVIEW_SECRET:
        required: true
permissions:
  contents: read
env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  NEXT_TELEMETRY_DISABLED: '1'
defaults:
  run:
    shell: bash
jobs:
  classify:
    name: Classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/agent/ci-shard-diagnostics'
    outputs:
      validation: ${{ steps.scope.outputs.validation }}
      build_required: ${{ steps.scope.outputs.build_required }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install frozen dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Record runner hardware
        run: node scripts/ci-build-evidence.mjs --kind runner --output tmp/ci-build/runner-classify.json
      - name: Classify fixed changed-path fixture
        id: scope
        env:
          DIAGNOSTIC_EXPERIMENT: ${{ inputs.experiment }}
          DIAGNOSTIC_VARIANT: ${{ inputs.variant }}
          DIAGNOSTIC_SCENARIO: ${{ inputs.scenario }}
          DIAGNOSTIC_FAILURE: ${{ inputs.failure }}
          DIAGNOSTIC_ROUND: ${{ inputs.round }}
        run: |-
          mkdir -p tmp/ci-build
          node scripts/ci-build-scope.mjs --experiment "$DIAGNOSTIC_EXPERIMENT" --variant "$DIAGNOSTIC_VARIANT" --scenario "$DIAGNOSTIC_SCENARIO" --failure "$DIAGNOSTIC_FAILURE" > tmp/ci-build/scope.json
      - name: Preserve safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ github.run_id }}-scope
          path: |-
            tmp/ci-build/scope.json
            tmp/ci-build/runner-classify.json
          if-no-files-found: error
          retention-days: 7
  ci-static:
    name: Static Checks
    needs:
      - classify
    if: needs.classify.outputs.validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Controlled static failure
        if: inputs.failure == 'static'
        run: exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Record runner hardware
        run: node scripts/ci-build-evidence.mjs --kind runner --output tmp/ci-build/runner-ci-static.json
      - name: Run tooling and data integrity tests
        run: pnpm vitest --project tooling --project data-integrity --run
      - name: Check formatting
        run: pnpm format:check
      - name: Generate permission matrix JSON
        run: pnpm matrix:derive json
      - name: Verify permission matrix alignment
        run: pnpm matrix:verify
      - name: Compare generated payload types
        id: payload_types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: pnpm run check:payload-types
      - name: Story governance check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "${BASE_REF}" ]]; then
            pnpm stories:governance:check -- --base-ref "origin/${BASE_REF}"
          else
            pnpm stories:governance:check
          fi
      - name: Lint
        id: lint
        run: pnpm lint
      - name: Preserve runner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ github.run_id }}-runner-ci-static
          path: tmp/ci-build/runner-ci-static.json
          if-no-files-found: ignore
          retention-days: 7
  unit-tests:
    name: Unit Tests
    needs:
      - classify
    if: needs.classify.outputs.validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Record runner hardware
        run: node scripts/ci-build-evidence.mjs --kind runner --output tmp/ci-build/runner-unit-tests.json
      - name: Run unit tests
        id: unit
        run: pnpm vitest --project unit --run --coverage --reporter=default --reporter=json --outputFile=tmp/ci-build/unit-raw.json
      - name: Upload unit coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-unit
          path: |
            coverage/unit/coverage-summary.json
            coverage/unit/coverage-final.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate suite identities and coverage
        if: always()
        run: node scripts/ci-build-evidence.mjs --kind suite --report tmp/ci-build/unit-raw.json --coverage coverage/unit/coverage-summary.json --output tmp/ci-build/unit-evidence.json
      - name: Preserve safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ github.run_id }}-unit
          path: |-
            tmp/ci-build/unit-evidence.json
            tmp/ci-build/runner-unit-tests.json
          if-no-files-found: error
          retention-days: 7
  storybook-tests:
    name: Storybook Tests
    needs:
      - classify
    if: needs.classify.outputs.validation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Record runner hardware
        run: node scripts/ci-build-evidence.mjs --kind runner --output tmp/ci-build/runner-storybook-tests.json
      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium
      - name: Run Storybook tests
        id: storybook
        run: pnpm vitest --project storybook --run --coverage --reporter=default --reporter=json --outputFile=tmp/ci-build/storybook-raw.json
      - name: Upload storybook coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-storybook
          path: |
            coverage/storybook/coverage-summary.json
            coverage/storybook/coverage-final.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate suite identities and coverage
        if: always()
        run: node scripts/ci-build-evidence.mjs --kind suite --report tmp/ci-build/storybook-raw.json --coverage coverage/storybook/coverage-summary.json --output tmp/ci-build/storybook-evidence.json
      - name: Preserve safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ github.run_id }}-storybook
          path: |-
            tmp/ci-build/storybook-evidence.json
            tmp/ci-build/runner-storybook-tests.json
          if-no-files-found: error
          retention-days: 7
  integration-tests:
    name: Integration Tests
    needs:
      - classify
      - ci-static
    if: needs.classify.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Record runner hardware
        run: node scripts/ci-build-evidence.mjs --kind runner --output tmp/ci-build/runner-integration-tests.json
      - name: Run integration tests
        id: integration
        env:
          NODE_ENV: test
        run: pnpm vitest --project integration --run --coverage --reporter=verbose --reporter=json --outputFile=tmp/ci-build/integration-raw.json
      - name: Upload integration coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-integration
          path: |
            coverage/integration/coverage-summary.json
            coverage/integration/coverage-final.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate suite identities and coverage
        if: always()
        run: node scripts/ci-build-evidence.mjs --kind suite --report tmp/ci-build/integration-raw.json --coverage coverage/integration/coverage-summary.json --output tmp/ci-build/integration-evidence.json
      - name: Preserve safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ github.run_id }}-integration
          path: |-
            tmp/ci-build/integration-evidence.json
            tmp/ci-build/runner-integration-tests.json
          if-no-files-found: error
          retention-days: 7
  coverage-merge:
    name: Combined Coverage
    needs:
      - classify
      - unit-tests
      - storybook-tests
      - integration-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          path: coverage-artifacts
      - name: Merge coverage summaries
        run: node scripts/coverage/merge-coverage.mjs --input-root coverage-artifacts --output-root coverage/combined
      - name: Upload combined coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-combined
          path: coverage/combined/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare combined coverage PR comment
        id: combined_coverage_comment
        if: github.event_name == 'pull_request'
        run: |
          if [ -f coverage/combined/summary.md ]; then
            {
              echo 'message<<EOF'
              cat coverage/combined/summary.md
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'message<<EOF'
              echo '# Combined Coverage Summary'
              echo
              echo 'Combined coverage summary not available.'
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Comment combined coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: combined-coverage-summary
          message: ${{ steps.combined_coverage_comment.outputs.message }}
      - name: Verify merged coverage sources
        if: needs.classify.outputs.validation == 'true'
        run: |-
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const summary=JSON.parse(fs.readFileSync('coverage/combined/coverage-summary.json','utf8'));
          const names=summary.sources.map(s=>s.name);
          if (!names.includes('unit') || !names.includes('storybook') || (process.env.EXPECT_INTEGRATION==='true' && !names.includes('integration'))) process.exit(1);
          NODE
        env:
          EXPECT_INTEGRATION: ${{ needs.classify.outputs.integration }}
  build-late:
    name: Build late
    needs:
      - classify
      - ci-static
      - unit-tests
      - storybook-tests
    if: needs.classify.outputs.build_required == 'true' && (inputs.experiment == 'filter' || inputs.variant == 'baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
      DATABASE_URI: postgresql://postgres:password@localhost:5432/findmydoc-portal
      DEPLOYMENT_ENV: development
    services:
      postgres:
        image: postgis/postgis:15-3.3
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: findmydoc-portal
        options: --health-cmd "pg_isready -U postgres -h localhost -d postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Record runner hardware
        run: node scripts/ci-build-evidence.mjs --kind runner --output tmp/ci-build/runner-build.json
      - name: Wait for PostgreSQL service
        run: bash ./.github/scripts/ci/wait-for-postgres.sh "${{ job.services.postgres.id }}"
      - name: Prepare build database
        run: pnpm run migrate
      - name: Build application (static check)
        run: pnpm build
      - name: Verify build output
        run: node scripts/ci-build-evidence.mjs --kind build --output tmp/ci-build/build-evidence.json
      - name: Preserve safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ github.run_id }}-build
          path: |-
            tmp/ci-build/build-evidence.json
            tmp/ci-build/runner-build.json
          if-no-files-found: error
          retention-days: 7
  build-early:
    name: Build early
    needs:
      - classify
    if: needs.classify.outputs.build_required == 'true' && inputs.experiment == 'schedule' && inputs.variant == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
      DATABASE_URI: postgresql://postgres:password@localhost:5432/findmydoc-portal
      DEPLOYMENT_ENV: development
    services:
      postgres:
        image: postgis/postgis:15-3.3
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: findmydoc-portal
        options: --health-cmd "pg_isready -U postgres -h localhost -d postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Record runner hardware
        run: node scripts/ci-build-evidence.mjs --kind runner --output tmp/ci-build/runner-build.json
      - name: Wait for PostgreSQL service
        run: bash ./.github/scripts/ci/wait-for-postgres.sh "${{ job.services.postgres.id }}"
      - name: Prepare build database
        run: pnpm run migrate
      - name: Build application (static check)
        run: pnpm build
      - name: Verify build output
        run: node scripts/ci-build-evidence.mjs --kind build --output tmp/ci-build/build-evidence.json
      - name: Preserve safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ github.run_id }}-build
          path: |-
            tmp/ci-build/build-evidence.json
            tmp/ci-build/runner-build.json
          if-no-files-found: error
          retention-days: 7
  result:
    name: Build
    needs:
      - classify
      - ci-static
      - unit-tests
      - storybook-tests
      - integration-tests
      - coverage-merge
      - build-late
      - build-early
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Preserve required result
        env:
          DIAGNOSTIC_NEEDS: ${{ toJSON(needs) }}
          DIAGNOSTIC_VALIDATION: ${{ needs.classify.outputs.validation }}
          DIAGNOSTIC_BUILD_REQUIRED: ${{ needs.classify.outputs.build_required }}
          DIAGNOSTIC_INTEGRATION: ${{ needs.classify.outputs.integration }}
        run: node scripts/ci-build-evidence.mjs --kind gate --output tmp/ci-build/gate.json
      - name: Preserve safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-${{ github.run_id }}-gate
          path: tmp/ci-build/gate.json
          if-no-files-found: error
          retention-days: 7
