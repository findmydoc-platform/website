name: Integration shard diagnostics

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Measurement stage
        type: choice
        options: [smoke, pilot, full, hooks, db-copy, db-copy-expanded, db-copy-order-check, cache-diagnostics]
        default: smoke
      round:
        description: Measurement round, 1 through 3
        type: choice
        options: ['1', '2', '3']
        default: '1'

      cache_experiment:
        description: Fresh cache experiment identifier
        type: string
        default: cache-v1

permissions:
  contents: read

concurrency:
  group: ci-shard-diagnostics-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  NEXT_TELEMETRY_DISABLED: '1'
  MEASUREMENT_STAGE: ${{ github.event_name == 'push' && 'smoke' || inputs.stage }}
  MEASUREMENT_ROUND: ${{ inputs.round || '1' }}

defaults:
  run:
    shell: bash

jobs:
  pair:
    name: Paired A and B
    if: inputs.stage != 'cache-diagnostics' && inputs.stage != 'hooks' && inputs.stage != 'db-copy' && inputs.stage != 'db-copy-expanded' && inputs.stage != 'db-copy-order-check' && github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/agent/ci-shard-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install frozen dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/assert-email-template-package-access.mjs
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Exercise diagnostic tooling
        if: env.MEASUREMENT_STAGE == 'smoke'
        run: pnpm vitest run --project tooling tests/tooling/scripts/ci-shard-diagnostics.test.ts tests/tooling/scripts/ci-shard-hook-diagnostics.test.ts tests/tooling/scripts/ci-shard-db-copy.test.ts
      - name: Measure paired variants
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ci-shard-diagnostics.mjs --stage "$MEASUREMENT_STAGE" --round "$MEASUREMENT_ROUND" --variant pair --output tmp/ci-diagnostics/round/pair --execute
      - name: Preserve paired measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-pair
          path: |
            tmp/ci-diagnostics/round
            !tmp/ci-diagnostics/round/**/cache/**
            !tmp/ci-diagnostics/round/**/*.mjs
          if-no-files-found: error
          retention-days: 7

  hooks:
    name: Serial beforeAll phase diagnostics
    if: inputs.stage == 'hooks' && github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/agent/ci-shard-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install frozen dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/assert-email-template-package-access.mjs
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Measure three serial repetitions
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          for diagnostic_round in 1 2 3; do
            node scripts/ci-shard-diagnostics.mjs --stage hooks --round "$diagnostic_round" --variant pair --output "tmp/ci-diagnostics/hooks/round-$diagnostic_round" --execute
            node scripts/ci-shard-hook-summary.mjs --input tmp/ci-diagnostics/hooks --partial
          done
          node scripts/ci-shard-hook-summary.mjs --input tmp/ci-diagnostics/hooks --output tmp/ci-diagnostics/hooks/summary.md
          cat tmp/ci-diagnostics/hooks/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve hook measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-hooks
          path: |
            tmp/ci-diagnostics/hooks
            !tmp/ci-diagnostics/hooks/**/cache/**
            !tmp/ci-diagnostics/hooks/**/*.mjs
          if-no-files-found: error
          retention-days: 7

  db-copy:
    name: Paired serial baseline database copy
    if: inputs.stage == 'db-copy' && github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/agent/ci-shard-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install frozen dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/assert-email-template-package-access.mjs
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Measure three serial database copy pairs
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          for diagnostic_round in 1 2 3; do
            node scripts/ci-shard-diagnostics.mjs --stage db-copy --round "$diagnostic_round" --variant pair --output "tmp/ci-diagnostics/db-copy/round-$diagnostic_round" --execute
            node scripts/ci-shard-db-copy-summary.mjs --input tmp/ci-diagnostics/db-copy --partial
          done
          node scripts/ci-shard-db-copy-summary.mjs --input tmp/ci-diagnostics/db-copy --output tmp/ci-diagnostics/db-copy/summary.md
          cat tmp/ci-diagnostics/db-copy/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve database copy measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-db-copy
          path: |
            tmp/ci-diagnostics/db-copy
            !tmp/ci-diagnostics/db-copy/**/cache/**
            !tmp/ci-diagnostics/db-copy/**/*.mjs
          if-no-files-found: error
          retention-days: 7

  db-copy-mixed:
    name: Mixed serial baseline database copy
    if: (inputs.stage == 'db-copy-expanded' || inputs.stage == 'db-copy-order-check') && github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/agent/ci-shard-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install frozen dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/assert-email-template-package-access.mjs
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Measure serial database copy pair 1
        id: copy-round-1
        if: inputs.stage == 'db-copy-expanded'
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ci-shard-diagnostics.mjs --stage db-copy-mixed --round 1 --variant pair --output tmp/ci-diagnostics/db-copy-mixed/round-1 --execute
          node scripts/ci-shard-db-copy-summary.mjs --input tmp/ci-diagnostics/db-copy-mixed --partial --output tmp/ci-diagnostics/db-copy-mixed/summary.md
          cat tmp/ci-diagnostics/db-copy-mixed/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve database copy pair 1
        if: always() && steps.copy-round-1.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-db-copy-mixed-round-1
          path: |
            tmp/ci-diagnostics/db-copy-mixed/round-1
            tmp/ci-diagnostics/db-copy-mixed/summary.md
            tmp/ci-diagnostics/db-copy-mixed/summary.md.json
            !tmp/ci-diagnostics/db-copy-mixed/**/cache/**
            !tmp/ci-diagnostics/db-copy-mixed/**/*.mjs
            !tmp/ci-diagnostics/db-copy-mixed/**/blob.json
          if-no-files-found: error
          retention-days: 7

      - name: Measure serial database copy pair 2
        id: copy-round-2
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ci-shard-diagnostics.mjs --stage db-copy-mixed --round 2 --variant pair --output tmp/ci-diagnostics/db-copy-mixed/round-2 --execute
          if [ "$MEASUREMENT_STAGE" = 'db-copy-order-check' ]; then exit 0; fi
          node scripts/ci-shard-db-copy-summary.mjs --input tmp/ci-diagnostics/db-copy-mixed --partial --output tmp/ci-diagnostics/db-copy-mixed/summary.md
          cat tmp/ci-diagnostics/db-copy-mixed/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve database copy pair 2
        if: always() && steps.copy-round-2.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-db-copy-mixed-round-2
          path: |
            tmp/ci-diagnostics/db-copy-mixed/round-2
            tmp/ci-diagnostics/db-copy-mixed/summary.md
            tmp/ci-diagnostics/db-copy-mixed/summary.md.json
            !tmp/ci-diagnostics/db-copy-mixed/**/cache/**
            !tmp/ci-diagnostics/db-copy-mixed/**/*.mjs
            !tmp/ci-diagnostics/db-copy-mixed/**/blob.json
          if-no-files-found: error
          retention-days: 7

      - name: Measure serial database copy pair 3
        id: copy-round-3
        if: inputs.stage == 'db-copy-expanded'
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ci-shard-diagnostics.mjs --stage db-copy-mixed --round 3 --variant pair --output tmp/ci-diagnostics/db-copy-mixed/round-3 --execute
          node scripts/ci-shard-db-copy-summary.mjs --input tmp/ci-diagnostics/db-copy-mixed --output tmp/ci-diagnostics/db-copy-mixed/summary.md
          cat tmp/ci-diagnostics/db-copy-mixed/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve database copy pair 3
        if: always() && steps.copy-round-3.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-db-copy-mixed-round-3
          path: |
            tmp/ci-diagnostics/db-copy-mixed/round-3
            tmp/ci-diagnostics/db-copy-mixed/summary.md
            tmp/ci-diagnostics/db-copy-mixed/summary.md.json
            !tmp/ci-diagnostics/db-copy-mixed/**/cache/**
            !tmp/ci-diagnostics/db-copy-mixed/**/*.mjs
            !tmp/ci-diagnostics/db-copy-mixed/**/blob.json
          if-no-files-found: error
          retention-days: 7

  db-copy-suite:
    needs: db-copy-mixed
    name: Complete serial baseline database copy
    if: needs.db-copy-mixed.result == 'success' && inputs.stage == 'db-copy-expanded' && github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/agent/ci-shard-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install frozen dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/assert-email-template-package-access.mjs
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Measure serial database copy pair 1
        id: copy-round-1
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ci-shard-diagnostics.mjs --stage db-copy-suite --round 1 --variant pair --output tmp/ci-diagnostics/db-copy-suite/round-1 --execute
          node scripts/ci-shard-db-copy-summary.mjs --input tmp/ci-diagnostics/db-copy-suite --partial --output tmp/ci-diagnostics/db-copy-suite/summary.md
          cat tmp/ci-diagnostics/db-copy-suite/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve database copy pair 1
        if: always() && steps.copy-round-1.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-db-copy-suite-round-1
          path: |
            tmp/ci-diagnostics/db-copy-suite/round-1
            tmp/ci-diagnostics/db-copy-suite/summary.md
            tmp/ci-diagnostics/db-copy-suite/summary.md.json
            !tmp/ci-diagnostics/db-copy-suite/**/cache/**
            !tmp/ci-diagnostics/db-copy-suite/**/*.mjs
            !tmp/ci-diagnostics/db-copy-suite/**/blob.json
          if-no-files-found: error
          retention-days: 7

      - name: Measure serial database copy pair 2
        id: copy-round-2
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ci-shard-diagnostics.mjs --stage db-copy-suite --round 2 --variant pair --output tmp/ci-diagnostics/db-copy-suite/round-2 --execute
          node scripts/ci-shard-db-copy-summary.mjs --input tmp/ci-diagnostics/db-copy-suite --partial --output tmp/ci-diagnostics/db-copy-suite/summary.md
          cat tmp/ci-diagnostics/db-copy-suite/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve database copy pair 2
        if: always() && steps.copy-round-2.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-db-copy-suite-round-2
          path: |
            tmp/ci-diagnostics/db-copy-suite/round-2
            tmp/ci-diagnostics/db-copy-suite/summary.md
            tmp/ci-diagnostics/db-copy-suite/summary.md.json
            !tmp/ci-diagnostics/db-copy-suite/**/cache/**
            !tmp/ci-diagnostics/db-copy-suite/**/*.mjs
            !tmp/ci-diagnostics/db-copy-suite/**/blob.json
          if-no-files-found: error
          retention-days: 7

      - name: Measure serial database copy pair 3
        id: copy-round-3
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ci-shard-diagnostics.mjs --stage db-copy-suite --round 3 --variant pair --output tmp/ci-diagnostics/db-copy-suite/round-3 --execute
          node scripts/ci-shard-db-copy-summary.mjs --input tmp/ci-diagnostics/db-copy-suite --output tmp/ci-diagnostics/db-copy-suite/summary.md
          cat tmp/ci-diagnostics/db-copy-suite/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve database copy pair 3
        if: always() && steps.copy-round-3.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-db-copy-suite-round-3
          path: |
            tmp/ci-diagnostics/db-copy-suite/round-3
            tmp/ci-diagnostics/db-copy-suite/summary.md
            tmp/ci-diagnostics/db-copy-suite/summary.md.json
            !tmp/ci-diagnostics/db-copy-suite/**/cache/**
            !tmp/ci-diagnostics/db-copy-suite/**/*.mjs
            !tmp/ci-diagnostics/db-copy-suite/**/blob.json
          if-no-files-found: error
          retention-days: 7

  shards:
    name: Parallel C shard ${{ matrix.shard }}
    needs: pair
    if: inputs.stage == 'full' && github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/agent/ci-shard-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install frozen dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/assert-email-template-package-access.mjs
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Measure parallel shard
        env:
          MEASUREMENT_SHARD: ${{ matrix.shard }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
        run: |
          set -euo pipefail
          node scripts/ci-shard-diagnostics.mjs --stage full --variant shard --round "$MEASUREMENT_ROUND" --shard "$MEASUREMENT_SHARD" --output "tmp/ci-diagnostics/round/shard-$MEASUREMENT_SHARD" --execute
      - name: Preserve shard measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            tmp/ci-diagnostics/round
            !tmp/ci-diagnostics/round/**/cache/**
            !tmp/ci-diagnostics/round/**/*.mjs
          if-no-files-found: error
          retention-days: 7

  summary:
    name: Validate measurement round
    needs: [pair, shards]
    if: always() && !cancelled() && needs.pair.result == 'success' && (needs.shards.result == 'success' || needs.shards.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install frozen dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/assert-email-template-package-access.mjs
          pnpm install --frozen-lockfile --strict-peer-dependencies
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-shard-${{ github.run_id }}-*
          path: tmp/ci-diagnostics/round
          merge-multiple: true
      - name: Merge parallel reports
        if: env.MEASUREMENT_STAGE == 'full'
        run: node scripts/ci-shard-diagnostics.mjs --merge C --output tmp/ci-diagnostics/round
      - name: Validate test and coverage equivalence
        run: |
          set -euo pipefail
          node scripts/ci-shard-summary.mjs --input tmp/ci-diagnostics/round --output tmp/ci-diagnostics/round/summary.md
          cat tmp/ci-diagnostics/round/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve validated round
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ci-shard-${{ github.run_id }}-summary
          path: |
            tmp/ci-diagnostics/round
            !tmp/ci-diagnostics/round/**/cache/**
            !tmp/ci-diagnostics/round/**/*.mjs
          retention-days: 7

  cache-diagnostics:
    name: Cache diagnostics
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'cache-diagnostics' && github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/agent/ci-shard-diagnostics'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-cache-diagnostics.yml
    with:
      experiment: ${{ inputs.cache_experiment }}
    secrets: inherit # pragma: allowlist secret
