name: PR Validation

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.secrets.baseline'
      - 'zizmor.yml'
      - '**/.github/dependabot.yml'
      - '**/*.md'
      - '**/.vscode/settings.json'
  workflow_dispatch:

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  NEXT_TELEMETRY_DISABLED: 1

defaults:
  run:
    shell: bash

jobs:
  paths:
    name: Path Filter
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      validation: ${{ steps.filter.outputs.changed == 'false' || steps.filter.outputs.non_markdown == 'true' }}
      deployable: ${{ steps.set-path-outputs.outputs.deployable }}
      integration: ${{ steps.set-path-outputs.outputs.integration }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect validation-relevant changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          predicate-quantifier: every
          filters: .github/filters/validation.yml

      - name: Set path outputs
        id: set-path-outputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changed }}
          NON_MARKDOWN: ${{ steps.filter.outputs.non_markdown }}
          DEPLOYABLE: ${{ steps.filter.outputs.deployable }}
          INTEGRATION: ${{ steps.filter.outputs.integration }}
          TEST_SUPPORT: ${{ steps.filter.outputs.test_support }}
          CHANGED_COUNT: ${{ steps.filter.outputs.changed_count }}
          PR_CHANGED_COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          for output in "$CHANGED" "$NON_MARKDOWN" "$DEPLOYABLE" "$INTEGRATION" "$TEST_SUPPORT"; do
            if [[ "$output" != true && "$output" != false ]]; then
              echo "::error::Path classification is incomplete. No omission is approved."
              exit 1
            fi
          done
          if [[ ! "$CHANGED_COUNT" =~ ^(0|[1-9][0-9]{0,8})$ || ("$CHANGED" == false && "$CHANGED_COUNT" != 0) || ("$CHANGED" == true && "$CHANGED_COUNT" == 0) ]]; then
            echo '::error::Native changed-file count is invalid. No omission is approved.'
            exit 1
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if [[ ! "$PR_CHANGED_COUNT" =~ ^(0|[1-9][0-9]{0,8})$ ]] || (( PR_CHANGED_COUNT <= 3000 && (CHANGED_COUNT < PR_CHANGED_COUNT || CHANGED_COUNT > 2 * PR_CHANGED_COUNT) )); then
              echo '::error::Native changed-file evidence is incomplete. No omission is approved.'
              exit 1
            fi
            # The PR API caps file discovery at 3000; renamed files expand into two native paths.
            if (( PR_CHANGED_COUNT > 3000 )); then
              echo '::error::PR exceeds the native API discovery limit. No omission is approved.'
              exit 1
            fi
          fi
          if [[ "$TEST_SUPPORT" == true ]]; then DEPLOYABLE=true; fi
          validation=true
          if [[ "$CHANGED" == true && "$NON_MARKDOWN" == false ]]; then validation=false; fi
          if [[ "$EVENT_NAME" == workflow_dispatch || "$CHANGED" == false ]]; then
            DEPLOYABLE=true
            INTEGRATION=true
          elif [[ "$EVENT_NAME" != pull_request ]]; then
            # Main full integration follows validation relevance, independently of the build.
            INTEGRATION="$validation"
          fi
          {
            echo "deployable=$DEPLOYABLE"
            echo "integration=$INTEGRATION"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## Validation scope'
            echo "- Application validation: $validation"
            echo "- Application build: $DEPLOYABLE"
            echo "- Integration: $INTEGRATION"
            if [[ "$EVENT_NAME" == pull_request && "$validation" == false ]]; then
              echo '- Static, unit and Storybook checks omitted: all changed files are Markdown documentation.'
            fi
            if [[ "$DEPLOYABLE" == false ]]; then
              echo '- Build omitted: every changed path is an approved test case, repository metadata or documentation path.'
            fi
            if [[ "$INTEGRATION" == false ]]; then
              echo '- Integration report intentionally absent: no integration inputs changed on the PR, or documentation-only Main scope.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ci-static:
    name: Static Checks
    needs: paths
    if: always() && (needs.paths.result != 'success' || github.event_name != 'pull_request' || needs.paths.outputs.validation != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require successful scope classification
        if: >-
          needs.paths.result != 'success' ||
          (needs.paths.outputs.validation != 'true' && needs.paths.outputs.validation != 'false') ||
          (needs.paths.outputs.deployable != 'true' && needs.paths.outputs.deployable != 'false') ||
          (needs.paths.outputs.integration != 'true' && needs.paths.outputs.integration != 'false')
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run tooling and data integrity tests
        run: pnpm vitest --project tooling --project data-integrity --run

      - name: Check formatting
        run: pnpm format:check

      - name: Generate permission matrix JSON
        run: pnpm matrix:derive json

      - name: Verify permission matrix alignment
        run: pnpm matrix:verify

      - name: Compare generated payload types
        id: payload_types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: pnpm run check:payload-types

      - name: Sync payload type review comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAYLOAD_TYPE_REVIEW_MODE: ${{ steps.payload_types.outputs.review_comment_mode }}
          PAYLOAD_TYPE_REVIEW_ANCHOR_PATH: ${{ steps.payload_types.outputs.review_anchor_path }}
          PAYLOAD_TYPE_SCHEMA_CONFIG_CHANGED: ${{ steps.payload_types.outputs.schema_config_changed }}
          PAYLOAD_TYPE_PAYLOAD_DEPENDENCY_CHANGED: ${{ steps.payload_types.outputs.payload_dependency_changed }}
          PAYLOAD_TYPE_UNKNOWN_OTHER_CAUSE: ${{ steps.payload_types.outputs.unknown_other_cause }}
          PAYLOAD_TYPE_DIFF_SNIPPET: ${{ steps.payload_types.outputs.diff_snippet }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/payload-type-review-comments.cjs');
            await run({ github, context, core, env: process.env });

      - name: Story governance check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "${BASE_REF}" ]]; then
            pnpm stories:governance:check -- --base-ref "origin/${BASE_REF}"
          else
            pnpm stories:governance:check
          fi

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Generate job summary
        if: always()
        run: |
          {
            echo "## Static Checks Summary"
            echo "- **Lint**: ${{ steps.lint.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit Tests
    needs: paths
    if: always() && (needs.paths.result != 'success' || github.event_name != 'pull_request' || needs.paths.outputs.validation != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require successful scope classification
        if: >-
          needs.paths.result != 'success' ||
          (needs.paths.outputs.validation != 'true' && needs.paths.outputs.validation != 'false') ||
          (needs.paths.outputs.deployable != 'true' && needs.paths.outputs.deployable != 'false') ||
          (needs.paths.outputs.integration != 'true' && needs.paths.outputs.integration != 'false')
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run unit tests
        id: unit
        run: pnpm vitest --project unit --run --coverage

      - name: Require unit coverage reports
        id: unit_reports
        if: always() && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure')
        run: test -s coverage/unit/coverage-summary.json && test -s coverage/unit/coverage-final.json

      - name: Publish Unit Test coverage
        if: always() && steps.unit_reports.outcome == 'success'
        uses: davelosert/vitest-coverage-report-action@15b5b41bb7d36796d89f4bf482b09529c53f3446
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vite-config-path: config/coverage/vitest.thresholds.unit.js
          name: Unit Tests
          file-coverage-mode: all
          json-summary-path: coverage/unit/coverage-summary.json
          json-final-path: coverage/unit/coverage-final.json

      - name: Upload unit coverage artifacts
        if: always() && steps.unit_reports.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: |
            coverage/unit/coverage-summary.json
            coverage/unit/coverage-final.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate job summary
        if: always()
        run: |
          {
            echo "## Unit Tests Summary"
            echo "- **Unit Tests**: ${{ steps.unit.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  storybook-tests:
    name: Storybook Tests
    needs: paths
    if: always() && (needs.paths.result != 'success' || github.event_name != 'pull_request' || needs.paths.outputs.validation != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require successful scope classification
        if: >-
          needs.paths.result != 'success' ||
          (needs.paths.outputs.validation != 'true' && needs.paths.outputs.validation != 'false') ||
          (needs.paths.outputs.deployable != 'true' && needs.paths.outputs.deployable != 'false') ||
          (needs.paths.outputs.integration != 'true' && needs.paths.outputs.integration != 'false')
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: mkdir -p ~/.cache/ms-playwright && pnpm exec playwright install chromium

      - name: Run Storybook tests
        id: storybook
        run: pnpm vitest --project storybook --run --coverage

      - name: Require Storybook coverage reports
        id: storybook_reports
        if: always() && (steps.storybook.outcome == 'success' || steps.storybook.outcome == 'failure')
        run: test -s coverage/storybook/coverage-summary.json && test -s coverage/storybook/coverage-final.json

      - name: Publish Storybook coverage
        if: always() && steps.storybook_reports.outcome == 'success'
        uses: davelosert/vitest-coverage-report-action@15b5b41bb7d36796d89f4bf482b09529c53f3446
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vite-config-path: config/coverage/vitest.thresholds.storybook.js
          name: Storybook Tests
          file-coverage-mode: all
          json-summary-path: coverage/storybook/coverage-summary.json
          json-final-path: coverage/storybook/coverage-final.json

      - name: Upload storybook coverage artifacts
        if: always() && steps.storybook_reports.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-storybook
          path: |
            coverage/storybook/coverage-summary.json
            coverage/storybook/coverage-final.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate job summary
        if: always()
        run: |
          {
            echo "## Storybook Tests Summary"
            echo "- **Storybook Tests**: ${{ steps.storybook.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs:
      - ci-static
      - unit-tests
      - storybook-tests
      - paths
    if: >-
      always() &&
      (needs.paths.result != 'success' ||
      needs.ci-static.result == 'failure' || needs.ci-static.result == 'cancelled' ||
      needs.unit-tests.result == 'failure' || needs.unit-tests.result == 'cancelled' ||
      needs.storybook-tests.result == 'failure' || needs.storybook-tests.result == 'cancelled' ||
      ((github.event_name != 'pull_request' || needs.paths.outputs.validation == 'true') &&
      (needs.ci-static.result != 'success' || needs.unit-tests.result != 'success' || needs.storybook-tests.result != 'success')) ||
      github.event_name == 'workflow_dispatch' || needs.paths.outputs.deployable != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
      DATABASE_URI: postgresql://postgres:password@localhost:5432/findmydoc-portal
      # This static CI build compiles Payload but never runs a hosted S3 runtime.
      DEPLOYMENT_ENV: development
    services:
      postgres:
        image: postgis/postgis:15-3.3
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: findmydoc-portal
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Require successful validation prerequisites
        if: >-
          needs.paths.result != 'success' ||
          (needs.paths.outputs.validation != 'true' && needs.paths.outputs.validation != 'false') ||
          (needs.paths.outputs.deployable != 'true' && needs.paths.outputs.deployable != 'false') ||
          (needs.paths.outputs.integration != 'true' && needs.paths.outputs.integration != 'false') ||
          needs.ci-static.result == 'failure' || needs.ci-static.result == 'cancelled' ||
          needs.unit-tests.result == 'failure' || needs.unit-tests.result == 'cancelled' ||
          needs.storybook-tests.result == 'failure' || needs.storybook-tests.result == 'cancelled' ||
          ((github.event_name != 'pull_request' || needs.paths.outputs.validation == 'true') &&
          (needs.ci-static.result != 'success' || needs.unit-tests.result != 'success' || needs.storybook-tests.result != 'success'))
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Wait for PostgreSQL service
        run: bash ./.github/scripts/ci/wait-for-postgres.sh "${{ job.services.postgres.id }}"

      - name: Prepare build database
        run: pnpm run migrate

      - name: Build application (static check)
        run: pnpm build

      - name: Generate job summary
        if: always()
        run: |
          {
            echo "## Build Job Summary"
            echo "- **Build**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: Integration Tests
    needs:
      - ci-static
      - paths
    if: >-
      always() && (needs.paths.result != 'success' ||
      needs.ci-static.result == 'failure' || needs.ci-static.result == 'cancelled' ||
      ((github.event_name != 'pull_request' || needs.paths.outputs.validation == 'true') && needs.ci-static.result != 'success') ||
      needs.paths.outputs.integration != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}

    steps:
      - name: Require successful integration prerequisites
        if: >-
          needs.paths.result != 'success' ||
          (needs.paths.outputs.validation != 'true' && needs.paths.outputs.validation != 'false') ||
          (needs.paths.outputs.deployable != 'true' && needs.paths.outputs.deployable != 'false') ||
          (needs.paths.outputs.integration != 'true' && needs.paths.outputs.integration != 'false') ||
          needs.ci-static.result == 'failure' || needs.ci-static.result == 'cancelled' ||
          ((github.event_name != 'pull_request' || needs.paths.outputs.validation == 'true') && needs.ci-static.result != 'success')
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run integration tests
        id: integration
        env:
          NODE_ENV: test
        run: node scripts/integration-runner.mjs

      - name: Require integration coverage reports
        id: integration_reports
        if: always() && (steps.integration.outcome == 'success' || steps.integration.outcome == 'failure')
        run: test -s coverage/integration/coverage-summary.json && test -s coverage/integration/coverage-final.json

      - name: Publish integration coverage
        if: always() && steps.integration_reports.outcome == 'success'
        uses: davelosert/vitest-coverage-report-action@15b5b41bb7d36796d89f4bf482b09529c53f3446
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vite-config-path: config/coverage/vitest.thresholds.integration.js
          name: Integration Tests
          file-coverage-mode: all
          json-summary-path: coverage/integration/coverage-summary.json
          json-final-path: coverage/integration/coverage-final.json

      - name: Upload integration coverage artifacts
        if: always() && steps.integration_reports.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: |
            coverage/integration/coverage-summary.json
            coverage/integration/coverage-final.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate job summary
        if: always()
        run: |
          {
            echo "## Integration Tests Summary"
            echo "- **Integration Tests**: ${{ steps.integration.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-merge:
    name: Combined Coverage
    needs:
      - paths
      - unit-tests
      - storybook-tests
      - integration-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Verify expected coverage results
        id: coverage_inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PATHS_RESULT: ${{ needs.paths.result }}
          VALIDATION: ${{ needs.paths.outputs.validation }}
          INTEGRATION: ${{ needs.paths.outputs.integration }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          STORYBOOK_RESULT: ${{ needs.storybook-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
        run: |
          set -euo pipefail
          {
            echo '## Coverage input results'
            echo "- Unit: $UNIT_RESULT"
            echo "- Storybook: $STORYBOOK_RESULT"
            echo "- Integration: $INTEGRATION_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PATHS_RESULT" != success || ("$VALIDATION" != true && "$VALIDATION" != false) || ("$INTEGRATION" != true && "$INTEGRATION" != false) ]]; then
            echo '::error::Coverage scope is unavailable. No absence is approved.'
            exit 1
          fi
          validation_required=false
          if [[ "$EVENT_NAME" != pull_request || "$VALIDATION" == true ]]; then validation_required=true; fi
          sources=()
          if [[ "$validation_required" == true ]]; then
            if [[ "$UNIT_RESULT" != success || "$STORYBOOK_RESULT" != success ]]; then
              echo '::error::Expected unit or Storybook validation did not succeed.'
              exit 1
            fi
            sources+=(unit storybook)
          elif [[ "$UNIT_RESULT" != skipped || "$STORYBOOK_RESULT" != skipped ]]; then
            echo '::error::Documentation omission has unexpected validation results.'
            exit 1
          else
            echo '- Unit and Storybook reports intentionally absent: documentation-only PR.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$INTEGRATION" == true ]]; then
            if [[ "$INTEGRATION_RESULT" != success ]]; then
              echo '::error::Expected integration validation did not succeed.'
              exit 1
            fi
            sources+=(integration)
          elif [[ "$INTEGRATION_RESULT" != skipped ]]; then
            echo '::error::Integration omission has an unexpected result.'
            exit 1
          else
            echo '- Integration report intentionally absent: successful scope classification requires no integration run.' >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "validation=$validation_required"
            echo "integration=$INTEGRATION"
            echo "sources=$(IFS=,; echo "${sources[*]}")"
            if [[ "${#sources[@]}" -gt 0 ]]; then echo 'required=true'; else echo 'required=false'; fi
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.coverage_inputs.outputs.required == 'true'

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        if: steps.coverage_inputs.outputs.required == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download unit coverage artifact
        if: steps.coverage_inputs.outputs.validation == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-unit
          path: coverage-artifacts/unit

      - name: Download Storybook coverage artifact
        if: steps.coverage_inputs.outputs.validation == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-storybook
          path: coverage-artifacts/storybook

      - name: Download integration coverage artifact
        if: steps.coverage_inputs.outputs.integration == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-integration
          path: coverage-artifacts/integration

      - name: Merge coverage summaries
        id: merge
        if: steps.coverage_inputs.outputs.required == 'true'
        env:
          EXPECTED_SOURCES: ${{ steps.coverage_inputs.outputs.sources }}
        run: node scripts/coverage/merge-coverage.mjs --input-root coverage-artifacts --output-root coverage/combined --expected-sources "$EXPECTED_SOURCES"

      - name: Upload combined coverage artifact
        if: always() && steps.merge.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined
          path: coverage/combined/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish combined coverage summary
        if: always()
        run: |
          if [ -f coverage/combined/summary.md ]; then
            cat coverage/combined/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.coverage_inputs.outputs.required }}" == false ]]; then
            echo 'Combined coverage intentionally absent: all coverage sources were permissibly omitted.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Combined coverage unavailable: expected validation, reports, transfer or merge failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Prepare combined coverage PR comment
        id: combined_coverage_comment
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f coverage/combined/summary.md ]; then
            {
              echo 'message<<EOF'
              cat coverage/combined/summary.md
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'message<<EOF'
              echo '# Combined Coverage Summary'
              echo
              if [[ "${{ steps.coverage_inputs.outputs.required }}" == false ]]; then
                echo 'Combined coverage intentionally absent: all coverage sources were permissibly omitted.'
              else
                echo 'Combined coverage unavailable: expected validation, reports, transfer or merge failed.'
              fi
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Comment combined coverage on PR
        if: always() && github.event_name == 'pull_request' && steps.combined_coverage_comment.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: combined-coverage-summary
          message: ${{ steps.combined_coverage_comment.outputs.message }}
