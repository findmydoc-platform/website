services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: findmydoc-postgres-test
    platform: linux/amd64
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: findmydoc-test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  s3mock:
    image: adobe/s3mock:5.1.0
    container_name: findmydoc-s3mock-test
    ports:
      - '127.0.0.1:9091:9090'
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: findmydoc-test
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3root
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/favicon.ico']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-test-data:
