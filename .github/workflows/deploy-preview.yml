name: Deploy Preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  CLINIC_DASHBOARD_URL: https://clinics.preview.findmydoc.eu
  EXPECTED_VERCEL_PROJECT_ID: prj_J8dOCr0Ft97TlCAUnbpdHG29Vtgx
  PREVIEW_ALIAS_DOMAIN: preview.findmydoc.eu
  NEXT_TELEMETRY_DISABLED: 1

defaults:
  run:
    shell: bash

jobs:
  paths:
    name: Preview Path Filter
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.set-path-outputs.outputs.deployable }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          predicate-quantifier: every
          filters: .github/filters/validation.yml

      - name: Set Preview build output
        id: set-path-outputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changed }}
          DEPLOYABLE: ${{ steps.filter.outputs.deployable }}
          TEST_SUPPORT: ${{ steps.filter.outputs.test_support }}
          CHANGED_COUNT: ${{ steps.filter.outputs.changed_count }}
          PR_CHANGED_COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          for output in "$CHANGED" "$DEPLOYABLE" "$TEST_SUPPORT"; do
            if [[ "$output" != true && "$output" != false ]]; then
              echo '::error::Path classification is incomplete. No omission is approved.'
              exit 1
            fi
          done
          if [[ ! "$CHANGED_COUNT" =~ ^(0|[1-9][0-9]{0,8})$ || ("$CHANGED" == false && "$CHANGED_COUNT" != 0) || ("$CHANGED" == true && "$CHANGED_COUNT" == 0) ]]; then
            echo '::error::Native changed-file count is invalid. No omission is approved.'
            exit 1
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            if [[ ! "$PR_CHANGED_COUNT" =~ ^(0|[1-9][0-9]{0,8})$ ]] || (( PR_CHANGED_COUNT <= 3000 && (CHANGED_COUNT < PR_CHANGED_COUNT || CHANGED_COUNT > 2 * PR_CHANGED_COUNT) )); then
              echo '::error::Native changed-file evidence is incomplete. No omission is approved.'
              exit 1
            fi
            # The PR API caps file discovery at 3000; renamed files expand into two native paths.
            if (( PR_CHANGED_COUNT > 3000 )); then
              echo '::error::PR exceeds the native API discovery limit. No omission is approved.'
              exit 1
            fi
          fi
          if [[ "$TEST_SUPPORT" == true ]]; then DEPLOYABLE=true; fi
          if [[ "$EVENT_NAME" == workflow_dispatch || "$CHANGED" == false ]]; then DEPLOYABLE=true; fi
          echo "deployable=$DEPLOYABLE" >> "$GITHUB_OUTPUT"
          {
            echo '## Preview build scope'
            echo "- New Preview deployment: $DEPLOYABLE"
            if [[ "$DEPLOYABLE" == false ]]; then
              echo '- Build and deployment omitted: every changed path is an approved test case, repository metadata or documentation path.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    name: Deploy Preview
    needs: paths
    # Preview deploys need Vercel secrets, so only trusted sources may run them.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
      (needs.paths.result != 'success' || needs.paths.outputs.deployable != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Preview
      url: ${{ github.event_name == 'push' && github.ref_name == 'main' && format('https://{0}', env.PREVIEW_ALIAS_DOMAIN) || steps.vercel_preview.outputs.deploymentUrl }}
    steps:
      - name: Require successful Preview scope classification
        if: needs.paths.result != 'success' || (needs.paths.outputs.deployable != 'true' && needs.paths.outputs.deployable != 'false')
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Preview deployment metadata
        id: deployment_metadata
        run: |
          set -euo pipefail
          deployment_commit_sha="$(git rev-parse HEAD)"
          [[ "$deployment_commit_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "commit_sha=$deployment_commit_sha" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          cache: false
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Pull Vercel Environment Variables for Preview
        env:
          EXPECTED_VERCEL_PROJECT_ID: ${{ env.EXPECTED_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bash ./.github/scripts/deploy/assert-vercel-project-binding.sh
          pnpm dlx vercel@canary pull --yes --environment=preview

      - name: Deploy to Vercel (Preview)
        id: vercel_preview
        env:
          DATABASE_DIRECT_URI: ${{ secrets.DATABASE_DIRECT_URI }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          DEPLOYMENT_COMMIT_SHA: ${{ steps.deployment_metadata.outputs.commit_sha }}
          DEPLOYMENT_ENVIRONMENT: preview
          EXPECTED_VERCEL_PROJECT_ID: ${{ env.EXPECTED_VERCEL_PROJECT_ID }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash ./.github/scripts/deploy/vercel-deploy.sh preview

      - name: Set Preview Alias
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_preview.outputs.deploymentUrl }}
          EXPECTED_VERCEL_PROJECT_ID: ${{ env.EXPECTED_VERCEL_PROJECT_ID }}
          PREVIEW_ALIAS_DOMAIN: ${{ env.PREVIEW_ALIAS_DOMAIN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bash ./.github/scripts/deploy/assert-vercel-project-binding.sh
          pnpm dlx vercel@canary alias set "$DEPLOYMENT_URL" "$PREVIEW_ALIAS_DOMAIN"

      - name: Generate deployment summary
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.vercel_preview.outcome }}
          DEPLOYMENT_URL: ${{ steps.vercel_preview.outputs.deploymentUrl }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          alias_domain=""
          if [[ "$SOURCE_EVENT" == "push" && "$SOURCE_BRANCH" == "main" ]]; then
            alias_domain="${PREVIEW_ALIAS_DOMAIN}"
          fi

          bash ./.github/scripts/deploy/write-preview-summary.sh "$DEPLOYMENT_OUTCOME" "$DEPLOYMENT_URL" "$alias_domain"
