# Native paths-filter uses predicate-quantifier: every for each filter.
changed:
  - '**'
non_markdown:
  - '!**/*.md'
deployable:
  - '**'
  - '!tests/**/*.test.{ts,tsx}'
  - '!tests/e2e/**/*.spec.{ts,tsx}'
  - '!.secrets.baseline'
  - '!.github/ISSUE_TEMPLATE/*.{yml,yaml}'
  - '!docs/**/*.md'
  - '!README.md'
# Test-like support paths must still build. One positive OR pattern keeps every semantics.
test_support:
  - '{tests/**/{setup,fixtures,fixture,helpers,helper,support,__fixtures__,__helpers__,__mocks__,mocks}/**,tests/**/*{[sS]etup,[fF]ixture,[hH]elper,[sS]upport}*.{test,spec}.{ts,tsx}}'
# Preserve known non-integration case and documentation omissions; unknown inputs run full.
integration:
  - '**'
  - '!tests/{unit,tooling,data-integrity}/**/*.test.{ts,tsx}'
  - '!tests/e2e/**/*.spec.{ts,tsx}'
  - '!.secrets.baseline'
  - '!.github/ISSUE_TEMPLATE/*.{yml,yaml}'
  - '!docs/**/*.md'
  - '!README.md'
integration_modified:
  - modified: 'tests/integration/**/*.test.ts'
