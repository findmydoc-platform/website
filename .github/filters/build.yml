# Each changed file must match every pattern; unknown paths still require a build.
deployable:
  - '**'
  - '!docs/**'
  - '!tests/**'
  - '!.github/**'
  - '!.githooks/**'
  - '!.codex/agents/**'
  - '!.codex/rules/**'
  - '!.codex/skills/**'
  - '!.codex/config.toml'
  - '!.storybook/**'
  - '!src/stories/**'
  - '!**/*.stories.{ts,tsx,js,jsx}'
  - '!**/*.md'
  - '!config/coverage/**'
  - '!vitest.config.*'
  - '!vitest.shims.d.ts'
  - '!playwright.config.*'
  - '!eslint.config.*'
  - '!audit-ci.jsonc'
  - '!knip.jsonc'
  - '!.dependency-cruiser.cjs'
  - '!.prettier*'
  - '!.pre-commit-config.yaml'
  - '!.secrets.baseline'
  - '!zizmor.yml'
  - '!.vscode/**'
  - '!.gitignore'
  - '!.gitattributes'
