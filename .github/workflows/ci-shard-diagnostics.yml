name: CI selection POC
run-name: Selection ${{ inputs.topic }} ${{ inputs.variant }} round ${{ inputs.round }}${{ inputs.group != 'email' && format(' group {0}', inputs.group) || '' }}

on:
  workflow_dispatch:
    inputs:
      topic:
        type: choice
        required: true
        options: [integration, storybook, e2e]
      variant:
        type: choice
        required: true
        options: [baseline, candidate]
      round:
        type: choice
        required: true
        options: ['1', '2']
      group:
        type: choice
        required: true
        default: email
        options: [email, categories, reviews]

permissions:
  contents: read

concurrency:
  group: selection-poc-${{ github.ref }}-${{ inputs.topic }}-${{ inputs.group }}-${{ inputs.variant }}-${{ inputs.round }}
  cancel-in-progress: false

env:
  TOPIC: ${{ inputs.topic }}
  VARIANT: ${{ inputs.variant }}
  ROUND: ${{ inputs.round }}
  GROUP: ${{ inputs.group }}
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2

defaults:
  run:
    shell: bash

jobs:
  scope:
    if: github.repository == 'findmydoc-platform/website' && github.ref == 'refs/heads/feature/ci-selection-poc'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: plan
        run: |
          set -euo pipefail
          args=()
          if [[ "$TOPIC" == integration ]]; then args+=(--group "$GROUP"); fi
          node scripts/ci-selection-poc/cli.mjs --topic "$TOPIC" --variant "$VARIANT" "${args[@]}" --output "$RUNNER_TEMP/selection-scope/plan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selection-scope
          path: ${{ runner.temp }}/selection-scope
          retention-days: 7
          if-no-files-found: error

  work:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: node scripts/assert-email-template-package-access.mjs && pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Cache Playwright browsers
        if: inputs.topic == 'storybook'
        id: playwright-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install browser
        if: inputs.topic == 'storybook' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: mkdir -p ~/.cache/ms-playwright && pnpm exec playwright install chromium
      - name: Run selected experiment
        run: |
          set -euo pipefail
          args=()
          if [[ "$TOPIC" == integration ]]; then args+=(--group "$GROUP"); fi
          node scripts/ci-selection-poc/run.mjs --topic "$TOPIC" --variant "$VARIANT" "${args[@]}" --round "$ROUND" --output "$RUNNER_TEMP/selection-worker"
      - name: Cleanup integration services
        if: always() && inputs.topic == 'integration'
        run: node --input-type=module -e "import {teardownTestDatabase} from './scripts/test-database-harness.mjs'; await teardownTestDatabase()"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: selection-worker
          path: ${{ runner.temp }}/selection-worker
          retention-days: 7
          if-no-files-found: error

  result:
    needs: [scope, work]
    if: always() && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    env:
      WORK_RESULT: ${{ needs.work.result }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: selection-*
          path: evidence
      - name: Validate expected results
        run: node scripts/ci-selection-poc/finalize.mjs evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: selection-result
          path: evidence/result.json
          retention-days: 7
          if-no-files-found: error
