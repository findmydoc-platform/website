name: Platform Release Deploy

run-name: findmydoc ${{ inputs.platform_version }} · ${{ inputs.plan_digest }} · ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Frozen website commit SHA
        required: true
        type: string
      platform_version:
        description: Shared findmydoc platform version
        required: true
        type: string
      plan_digest:
        description: Frozen platform release plan digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify-dispatcher:
    name: Require platform release dispatcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify dispatch identity
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: bash ./.github/scripts/deploy/require-platform-release-dispatcher.sh

  deploy:
    needs: verify-dispatcher
    uses: findmydoc-platform/platform-release/.github/workflows/reusable-deploy-website.yml@fde486496d8bde13a3c8cad9d23a1cbbe075507d
    with:
      target_sha: ${{ inputs.target_sha }}
      platform_version: ${{ inputs.platform_version }}
      plan_digest: ${{ inputs.plan_digest }}
    secrets:
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
