name: Website Production Secret Binding Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct:
    name: Direct Production job
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - name: Report secret presence
        shell: bash
        env:
          DATABASE_DIRECT_URI: ${{ secrets.DATABASE_DIRECT_URI }}
        run: |
          set -euo pipefail
          if [[ -n "$DATABASE_DIRECT_URI" ]]; then
            echo "DATABASE_DIRECT_URI=present"
          else
            echo "DATABASE_DIRECT_URI=missing"
          fi

  reusable-unmapped:
    name: Reusable job without secret mapping
    if: github.ref == 'refs/heads/main'
    uses: findmydoc-platform/platform-release/.github/workflows/reusable-secret-binding-probe.yml@8c6afc2b37ca4360dc36109593cd1921bee7e376

  reusable-mapped:
    name: Reusable job with secret mapping
    if: github.ref == 'refs/heads/main'
    uses: findmydoc-platform/platform-release/.github/workflows/reusable-secret-binding-probe.yml@8c6afc2b37ca4360dc36109593cd1921bee7e376
    secrets:
      DATABASE_DIRECT_URI: ${{ secrets.DATABASE_DIRECT_URI }}
